<style>
:root{--bg:#0d1320;--panel:#151d2e;--panel2:#1c2740;--line:#273451;--text:#e8edf7;--mute:#8e9bb5;--acc:#ff7a1a;--acc2:#ffb066;--good:#3ecf8e;--bad:#ff5d6c;--blue:#4da3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#1a1208,#151d2e 60%);border-bottom:2px solid var(--acc);flex-wrap:wrap}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px}
.brand b{color:var(--acc)}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.spacer{flex:1}
nav{display:flex;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;color:var(--mute);padding:12px 14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
nav button.on{color:var(--text);border-bottom-color:var(--acc)}
main{max-width:1150px;margin:0 auto;padding:16px}
h2{margin:4px 0 12px;font-size:20px}
h3{margin:16px 0 8px;font-size:15px;color:var(--acc2);text-transform:uppercase;letter-spacing:.8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mute)}
.small{font-size:12px}
button.btn,label.btn,select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
button.btn,label.btn{cursor:pointer;font-weight:700}
button.btn:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#1a0e02}
button.danger{border-color:var(--bad);color:var(--bad)}
button.sm{padding:3px 9px;font-size:12px}
button:disabled{opacity:.4;cursor:not-allowed}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
td.num,th.num{text-align:right}
.pos{display:inline-block;min-width:34px;text-align:center;font-size:11px;font-weight:800;padding:2px 5px;border-radius:5px;background:var(--panel2);color:var(--acc2)}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;font-weight:700;margin:1px 2px 1px 0}
.chip.c{background:rgba(62,207,142,.18);color:var(--good)}
.chip.x{background:rgba(255,93,108,.12);color:var(--bad);text-decoration:line-through}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;cursor:pointer}
.mu .s{font-size:24px;font-weight:900}
.mu .r{text-align:right}
.win{color:var(--good)}
.banner{background:linear-gradient(90deg,rgba(255,122,26,.25),transparent);border-left:4px solid var(--acc);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-weight:700}
.board{display:grid;gap:3px;font-size:11px}
.board div{background:var(--panel2);border-radius:5px;padding:4px;min-height:38px;overflow:hidden}
.board .hd{background:none;font-weight:800;color:var(--acc2);min-height:0;text-align:center}
.board .me{outline:1px solid var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.mu .s{font-size:19px}}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--mute);font-weight:700}
.tag.live{color:var(--good)}
.tag.sim{color:var(--acc2)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .card{max-width:440px;width:100%;max-height:86vh;overflow:auto}
#modal .card.wide{max-width:820px}
a.pl{color:var(--text);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--mute)}
a.pl:hover{color:var(--acc2)}
.pc-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pc-head img{width:96px;height:70px;object-fit:cover;object-position:top;border-radius:10px;background:var(--panel2)}
.pc-ph{width:96px;height:70px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:var(--acc2)}
.inj{display:inline-block;background:var(--bad);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px}
.lock{color:var(--mute);font-size:12px}
a{color:var(--blue)}
</style>
</head>

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'').replace(/(jr|sr|iii|ii|iv)$/,'');
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
function hash(s){ let h=2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=seed||1; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- dates / weeks ---------- */
function ymd(d){ return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function seasonStartDate(){ const x=(S&&S.settings&&S.settings.seasonStart)||'20261020'; return new Date(+x.slice(0,4), +x.slice(4,6)-1, +x.slice(6)); }
function weekLen(w){ if (w>1) return 7; const g=seasonStartDate().getDay(); return g===0 ? 1 : 8-g; }   // week 1 runs opening night → Sunday
function weekStart(w){ const s=seasonStartDate(); if (w===1) return s; const d=new Date(s); d.setDate(s.getDate()+weekLen(1)+7*(w-2)); return d; }
function weekDates(w){ const s=weekStart(w), out=[]; for(let i=0;i<weekLen(w);i++){ const d=new Date(s); d.setDate(s.getDate()+i); out.push(ymd(d)); } return out; }
function weekLabel(w){ const s=weekStart(w), e=new Date(s); e.setDate(s.getDate()+weekLen(w)-1); const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); return `Week ${w} · ${f(s)}–${f(e)}`; }
const todayStr = () => ymd(new Date());
function totalWeeks(){ return S.settings.regWeeks + playoffRounds().reduce((a,r)=>a+r.weeks.length,0); }
function liveWeek(){ const t=todayStr(); for(let w=1;w<=totalWeeks();w++){ const d=weekDates(w); if(t<=d[d.length-1]) return w; } return totalWeeks(); }
const isSim = () => S.settings.statsMode==='sim';
function curWeek(){ if(!isSim()) return liveWeek(); const s=S.settings; return Math.max(1, Math.min(totalWeeks(), s.simWeek + (s.simDay>0?1:0))); }
function weekLocked(w){ const s=S.settings; return isSim()? (w<=s.simWeek || (w===s.simWeek+1 && s.simDay>0)) : todayStr()>=weekDates(w)[0]; }
/* how many days of week w have been "played" in sim mode */
function simDaysPlayed(w){ const s=S.settings; if(w<=s.simWeek) return weekLen(w); if(w===s.simWeek+1) return Math.min(s.simDay, weekLen(w)); return 0; }
const dayName = d => DAY_NAMES[(new Date(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6)).getDay()+6)%7];
function simStatus(){ const s=S.settings; if(s.simWeek>=totalWeeks()) return 'Season complete (incl. playoffs)'; const w=s.simWeek+1; return s.simDay>0 ? `Week ${w}, games played through ${dayName(weekDates(w)[s.simDay-1])}` : `Start of Week ${w} — no games played yet`; }
function simAdvanceDay(){ const s=S.settings; if(s.simWeek>=totalWeeks()) return; let w=s.simWeek, d=s.simDay+1; if(d>=weekLen(w+1)){ w++; d=0; } Store.update({'settings/simWeek':w,'settings/simDay':d}); processPending(true); }
function simFinishWeek(){ const s=S.settings; if(s.simWeek>=totalWeeks()) return; Store.update({'settings/simWeek':s.simWeek+1,'settings/simDay':0}); processPending(true); }
function simSet(w,d){ Store.update({'settings/simWeek':Math.max(0,Math.min(totalWeeks(),w)),'settings/simDay':d}); ui.week=null; }
function weekDone(w){ if(isSim()) return w<=S.settings.simWeek; const d=weekDates(w); return todayStr()>d[d.length-1]; }

function setPath(obj,path,val){ const k=path.split('/'); let o=obj; for(let i=0;i<k.length-1;i++){ if(typeof o[k[i]]!=='object'||o[k[i]]===null) o[k[i]]={}; o=o[k[i]]; } if(val===null||val===undefined) delete o[k[k.length-1]]; else o[k[k.length-1]]=val; }
function normalize(x){ if(!x||!x.settings) return null; x.settings={...DEFAULT_SETTINGS,...x.settings}; x.settings.scoring={...DEFAULT_SETTINGS.scoring,...(x.settings.scoring||{})}; for(const k of ['teams','rosters','lineups','trades','log','keepers','history','waivers','claims','adds']) x[k]=x[k]||{}; x.draft=x.draft||{status:'pre',order:Object.keys(x.teams),picks:{}}; x.draft.picks=x.draft.picks||{}; x.draft.order=x.draft.order||Object.keys(x.teams); return x; }
const clone = o => JSON.parse(JSON.stringify(o));
const Store = {
  async init(){

      try{

            S = normalize(val); LOST_COPY = null;
            lsSet(MIRROR_KEY, JSON.stringify({ts:Date.now(), data:val}));   // this device keeps its own copy too
            autoCheckpoint();
          } else {
            S = null;
            try{ const m = JSON.parse(lsGet(MIRROR_KEY)||'null'); LOST_COPY = (m && m.data && m.data.settings) ? m : null; }catch(e){ LOST_COPY = null; }
          }
          render();
        }, err => { console.warn(err); toast('Could not read the database: '+err.message); });
        render();
        return;
      }catch(e){ console.warn('Firebase failed, using this browser only', e); }
    }
    STORE_MODE='local'; LOADED = true;
    try{ S = normalize(JSON.parse(lsGet(LS_KEY)||'null')); }catch(e){ S=null; }
    try{ bc = new BroadcastChannel(LS_KEY); bc.onmessage = () => { try{ S=normalize(JSON.parse(lsGet(LS_KEY)||'null')); }catch(e){} render(); }; }catch(e){}
    render();
  },
  update(u){
    if (STORE_MODE==='firebase'){ fbRef.update(u).catch(e=>toast('Save failed: '+e.message)); return; }
    for (const k in u) setPath(S,k,u[k]);
    S = normalize(S); this._save(); render();
  },
  /* whole-league overwrite: only create / delete / restore / mock->league. Always checkpoints first. */
  async replace(obj, reason){
    if (STORE_MODE==='firebase'){
      if (S && !isCommish()) return toast('Only the commissioner can replace the whole league.');
      if (S) await checkpoint('Before: '+(reason||'replace league'), true);
      fbRef.set(obj).catch(e=>toast('Save failed: '+e.message)); return;
    }
    S = normalize(obj); this._save(); render();
  },
  _save(){ lsSet(LS_KEY, JSON.stringify(S)); try{ bc && bc.postMessage(1); }catch(e){} },
  /* only one device at a time gets to run a job (waivers, auto-pick); others skip */
  async lock(key, ms){
    if (STORE_MODE!=='firebase') return true;
    try{ const r = await fbRef.child('locks/'+key).transaction(cur => (cur && Date.now()-cur < ms) ? undefined : Date.now()); return r.committed; }catch(e){ return false; }
  }
};
/* ---------- backups: cloud checkpoints + file export ---------- */
async function checkpoint(reason, keep){
  if (STORE_MODE!=='firebase' || !S) return;
  const id = String(Date.now());
  try{
    await bkRef.child(id).set({ts:+id, reason: reason||'checkpoint', keep: !!keep, picks:Object.keys(S.draft.picks).length, data: clone(S)});
    const snap = await bkRef.orderByKey().once('value'); const all = []; snap.forEach(c=>{ all.push({k:c.key, keep:c.child('keep').val()}); });
    const prunable = all.filter(x=>!x.keep); while (prunable.length > 40){ bkRef.child(prunable.shift().k).remove(); }
  }catch(e){ console.warn('checkpoint failed', e); }
}
let autoCkDone = false;
async function autoCheckpoint(){
  if (autoCkDone || !S) return; autoCkDone = true;
  try{ const snap = await bkRef.orderByKey().limitToLast(1).once('value'); let last = 0; snap.forEach(c=>{ last = +c.key; });
    if (Date.now() - last > 12*3600e3) checkpoint('Automatic (every 12 hours)'); }catch(e){}
}

  const data = S || (LOST_COPY && LOST_COPY.data); if (!data) return toast('Nothing to back up yet.');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));

}

/* ---------- player pool ---------- */
let POOL = {}, POOL_SRC = 'loading';
const RANK_BY_NAME = Object.fromEntries(RANKS.map(p=>[norm(p.name),p.rank]));
async function loadPool(){
  const cached = lsGet('b3h_pool');
  if (cached){ try{ const c=JSON.parse(cached); if(Date.now()-c.t<12*3600e3 && Object.keys(c.p).length>200){ POOL=c.p; POOL_SRC='ESPN (cached)'; return; } }catch(e){} }
  try{
    const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 9000);
    const tj = await (await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams',{signal:ctl.signal})).json();
    const teams = tj.sports[0].leagues[0].teams.map(t=>t.team);
    const out = {};
    await Promise.all(teams.map(async t=>{
      const r = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/${t.id}/roster`,{signal:ctl.signal})).json();
      for (const a of (r.athletes||[])){
        const items = a.items ? a.items : [a];
        for (const p of items){
          out[p.id] = {id:String(p.id), name:p.displayName||p.fullName, team:t.abbreviation, pos:(p.position&&p.position.abbreviation)||'UTIL',
            rank: RANK_BY_NAME[norm(p.displayName||p.fullName)] || 999, inj:(p.injuries&&p.injuries[0]&&p.injuries[0].status)||''};
        }
      }
    }));
    if (Object.keys(out).length < 200) throw new Error('small pool');
    // unranked players get ordered after the ranked list
    let n = RANKS.length+1; Object.values(out).filter(p=>p.rank===999).sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>p.rank=n++);
    POOL = out; POOL_SRC = 'ESPN live rosters';
    lsSet('b3h_pool', JSON.stringify({t:Date.now(), p:out}));
  }catch(e){
    POOL = Object.fromEntries(RANKS.map(p=>[p.id,p])); POOL_SRC = 'Built-in list (ESPN unreachable)';
  }
}

/* ---------- stats: simulated + live ESPN ---------- */
function teamGamesSim(team,w){
  const r = rng(hash(team+'|'+w+'|'+(S.settings.simSeed||1))), dates = weekDates(w);
  const n = w===1 ? (r()<.5?2:3) : (r()<.45?3:4);
  const idx = [...dates.keys()].sort(()=>r()-.5).slice(0,n).sort((a,b)=>a-b);
  return idx.map(i=>({date:dates[i], opp: NBA[Math.floor(r()*NBA.length)]})).filter(g=>g.opp!==team);
}
function simLine(pid,info,date){
  const r = rng(hash(pid+'@'+date+'|'+(S.settings.simSeed||1)));
  if (r() < .07) return null; // DNP
  const B = Math.max(14, 62 - 0.35*Math.min(info.rank||200,140));
  const pos = info.pos||'';
  const prof = /C/.test(pos)?{reb:.22,ast:.06,stl:.014,blk:.034,tp:.08} : /PG|^G$/.test(pos)?{reb:.075,ast:.165,stl:.026,blk:.006,tp:.38} : {reb:.115,ast:.08,stl:.02,blk:.013,tp:.32};
  const f = 0.55 + r()*0.9, j = () => 0.7 + r()*0.6;
  const PTS = Math.round(B*.4*f*j()), FGM = Math.round(PTS*.37*j()), FGA = Math.max(FGM, Math.round(FGM/(0.42+r()*0.14)));
  const TPA = Math.round(FGA*prof.tp*j()), TPM = Math.min(TPA, Math.round(TPA*(0.28+r()*0.16))), FTA = Math.round(PTS*.22*j()), FTM = Math.min(FTA, Math.round(FTA*(0.68+r()*0.2)));
  const REB = Math.round(B*prof.reb*f*j()), OREB = Math.round(REB*(0.15+r()*0.2));
  return {PTS, FGM, FGA, '3PM':TPM, '3PA':TPA, FTM, FTA, REB, OREB, DREB:REB-OREB, AST:Math.round(B*prof.ast*f*j()), STL:Math.round(B*prof.stl*f*j()*1.2), BLK:Math.round(B*prof.blk*f*j()*1.2),
    TO:Math.round(B*.045*f*j()), PF:Math.round(r()*4.5), MIN:Math.round(18+B*.3*f*j())};
}
const LIVE = {}; // date -> {byId, byName, done}
const SCHED = {}; // date -> [team abbrs playing that day] (live mode)
const TIP = {};   // date -> earliest tip-off time (ms)
const GI = {};    // date -> {TEAM: {opp, status, state, score}}
function giFrom(sb){ const out={}; for(const ev of (sb.events||[])){ const comp=(ev.competitions||[])[0]||{}, cs=comp.competitors||[], st=(ev.status&&ev.status.type)||{}, tip=Date.parse(ev.date)||0;
  const sc = cs.map(c=>`${c.team&&c.team.abbreviation} ${c.score||''}`).join(' – ');
  for (const c of cs){ const ab=c.team&&c.team.abbreviation, o=cs.find(x=>x!==c); out[ab]={opp:(c.homeAway==='home'?'vs ':'@ ')+(o&&o.team&&o.team.abbreviation||''), status:st.shortDetail||'', state:st.state||'pre', tip, score: st.state==='pre'?'':sc}; } } return out; }
function tipFrom(sb,d){ const ts=(sb.events||[]).map(e=>Date.parse(e.date)).filter(x=>x>0); if(ts.length){ TIP[d]=Math.min(...ts); lsSet('b3h_tip_'+d, String(TIP[d])); } }
function schedFrom(sb){ const out=[]; for(const ev of (sb.events||[])) for(const c of (((ev.competitions||[])[0]||{}).competitors||[])) if(c.team) out.push(c.team.abbreviation); return out; }

function gamesThisWeek(pid,w){ const p=pInfo(pid); if(isSim()) return teamGamesSim(p.team,w).length; const ds=weekDates(w); if(!ds.some(d=>SCHED[d])) return 3.5; return ds.filter(d=>SCHED[d]&&SCHED[d].includes(p.team)).length; }
let liveLoading = false;
async function loadLiveWeek(w){
  if (liveLoading) return; liveLoading = true;
  const t = todayStr();

async function startNextSeason(){

    const taken = new Set(), pickIdx = (r,c) => (r%2===1) ? r*N+(N-1-c) : r*N+c;

/* ---------- transactions: adds, drops, waivers, IR, trades ---------- */
const DAY_MS = 864e5;
function addsUsed(t){ return ((S.adds[t]||{})['w'+curWeek()])||0; }
function addsLeft(t){ const lim = S.settings.addsPerWeek||0; return lim ? Math.max(0, lim-addsUsed(t)) : Infinity; }
function onWaivers(pid){ if (S.settings.acqSystem!=='waivers') return false; const w = S.waivers[pid]; return !!(w && w.until > Date.now()); }
function waiverText(pid){ const w = S.waivers[pid]; return w ? 'Waivers until '+new Date(w.until).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'}) : ''; }
function putOnWaivers(u,pid){ if (S.settings.acqSystem==='waivers' && S.settings.waiverDays>0) u['waivers/'+pid] = {until: Date.now()+S.settings.waiverDays*DAY_MS}; }
function countAdd(u,t){ const k='adds/'+t+'/w'+curWeek(); u[k] = (u[k]!==undefined?u[k]:addsUsed(t)) + 1; }
function addPlayer(t, pid, dropPid){
  const p = POOL[pid] || pInfo(pid);
  if (ownerOf(pid)) return toast(p.name+' is already on a roster.');
  if (!isCommish() && addsLeft(t)<=0) return toast(`You've used all ${S.settings.addsPerWeek} adds for this matchup.`);
  if (activeCount(t) - (dropPid?1:0) >= S.settings.rosterSize) return toast('Your roster is full — pick someone to drop.');
  if (onWaivers(pid)){
    const id = uid();
    Store.update(logUpdate({['claims/'+id]:{team:t, pid, drop:dropPid||null, ts:Date.now(), status:'pending'}}, `${tName(t)} put in a waiver claim`));
    return toast(`Waiver claim placed for ${p.name}. It's decided when his waiver period ends (${waiverText(pid).replace('Waivers until ','')}) — best waiver priority wins.`);
  }
  const u = freezeLineups(t,{});
  u['rosters/'+t+'/'+pid] = snap(p);
  if (dropPid){ u['rosters/'+t+'/'+dropPid] = null; putOnWaivers(u,dropPid); }
  countAdd(u,t);
  logUpdate(u, `${tName(t)} added ${p.name}` + (dropPid?`, dropped ${pInfo(dropPid).name}`:''));
  Store.update(u);
}
function dropPlayer(t,pid){ const u = freezeLineups(t,{['rosters/'+t+'/'+pid]:null}); putOnWaivers(u,pid); Store.update(logUpdate(u, `${tName(t)} dropped ${pInfo(pid).name}`)); }
function cancelClaim(id){ Store.update({['claims/'+id+'/status']:'cancelled'}); }
/* IR: injured players move off the active roster, freeing a spot */
function canIR(pid){ return isSim() || isCommish() || /out|injur/i.test(pInfo(pid).inj||''); }
function moveToIR(t,pid){
  if (irIds(t).length >= S.settings.irSlots) return toast(`IR is full (${S.settings.irSlots} spots).`);
  if (!canIR(pid)) return toast('Only players listed as OUT can go on IR.');
  Store.update(logUpdate(freezeLineups(t,{['rosters/'+t+'/'+pid+'/ir']:true}), `${tName(t)} moved ${pInfo(pid).name} to IR`));
}
function activateIR(t,pid){
  if (activeCount(t) >= S.settings.rosterSize) return toast('No open roster spot — drop someone first.');
  Store.update(logUpdate(freezeLineups(t,{['rosters/'+t+'/'+pid+'/ir']:null}), `${tName(t)} activated ${pInfo(pid).name} from IR`));
}
/* waivers: when a player's waiver period ends, the claim from the team with the best waiver priority wins;
   that team moves to the back of the line (never resets) */
function processWaivers(u, force){
  const now = Date.now(); let order = (S.waiverOrder||[]).slice(); const extra = {};
  if (!order.length) order = S.draft.order.slice().reverse();
  for (const [pid,w] of Object.entries(S.waivers)){
    if (!force && w.until > now) continue;
    const cl = Object.entries(S.claims).filter(([id,c])=>c.pid===pid && c.status==='pending').sort((a,b)=>order.indexOf(a[1].team)-order.indexOf(b[1].team) || a[1].ts-b[1].ts);
    let won = null;
    for (const [id,c] of cl){
      const dropOk = !c.drop || (ownerOf(c.drop)===c.team && u['rosters/'+c.team+'/'+c.drop]!==null);
      const size = activeCount(c.team) + (extra[c.team]||0) - (c.drop?1:0);
      if (!won && !ownerOf(pid) && dropOk && size < S.settings.rosterSize && (addsLeft(c.team)>0)){
        won = c; freezeLineups(c.team,u);
        u['claims/'+id+'/status'] = 'won'; u['rosters/'+c.team+'/'+pid] = snap(POOL[pid]||pInfo(pid));
        if (c.drop){ u['rosters/'+c.team+'/'+c.drop] = null; putOnWaivers(u,c.drop); } else extra[c.team] = (extra[c.team]||0)+1;
        countAdd(u,c.team); order = order.filter(x=>x!==c.team).concat(c.team);
        logUpdate(u, `WAIVERS: ${tName(c.team)} claimed ${pInfo(pid).name}`+(c.drop?`, dropped ${pInfo(c.drop).name}`:''));
      } else u['claims/'+id+'/status'] = 'lost';
    }
    u['waivers/'+pid] = null;
  }
  if (JSON.stringify(order)!==JSON.stringify(S.waiverOrder||[])) u['waiverOrder'] = order;
}
function tradeProblem(tr){
  const give = Object.keys(tr.give||{}), get = Object.keys(tr.get||{});
  if (give.some(p=>ownerOf(p)!==tr.from) || get.some(p=>ownerOf(p)!==tr.to)) return 'players are no longer on those rosters';
  const act = (t,list) => list.filter(p=>!S.rosters[t][p].ir).length, size = S.settings.rosterSize;
  if (activeCount(tr.from) - act(tr.from,give) + act(tr.to,get) > size || activeCount(tr.to) - act(tr.to,get) + act(tr.from,give) > size) return `a roster would go over ${size} players`;
  return '';
}
function executeTrade(id,u){
  const tr = S.trades[id], give = Object.keys(tr.give||{}), get = Object.keys(tr.get||{});
  const why = tradeProblem(tr); if (why){ u['trades/'+id+'/status'] = 'failed'; logUpdate(u, 'Trade failed: '+why); return false; }
  freezeLineups(tr.to, freezeLineups(tr.from, u));
  u['trades/'+id+'/status'] = 'accepted'; u['trades/'+id+'/done'] = Date.now();
  give.forEach(p=>{ u['rosters/'+tr.from+'/'+p]=null; u['rosters/'+tr.to+'/'+p]=S.rosters[tr.from][p]; });
  get.forEach(p=>{ u['rosters/'+tr.to+'/'+p]=null; u['rosters/'+tr.from+'/'+p]=S.rosters[tr.to][p]; });
  logUpdate(u, `TRADE: ${tName(tr.from)} sends ${give.map(p=>pInfo(p).name).join(', ')||'nothing'} to ${tName(tr.to)} for ${get.map(p=>pInfo(p).name).join(', ')||'nothing'}`);
  return true;
}
/* accepting starts the league review period; other teams can vote to veto */
function acceptTrade(id, now){
  const tr = S.trades[id]; if (!tr) return;
  const why = tradeProblem(tr); if (why) return toast('Trade can\'t go through: '+why+'.');
  const days = S.settings.tradeReviewDays||0;
  if (days>0 && !now){ Store.update(logUpdate({['trades/'+id+'/status']:'review', ['trades/'+id+'/reviewUntil']:Date.now()+days*DAY_MS}, `${tName(tr.to)} accepted a trade with ${tName(tr.from)} — ${days}-day league review started`)); return; }
  checkpoint('Before trade');
  const u = {}; executeTrade(id,u); Store.update(u);
}
function voteVeto(id){ Store.update({['trades/'+id+'/votes/'+ME]:true}); }
function processTrades(u, force){
  for (const [id,tr] of Object.entries(S.trades)){
    if (tr.status!=='review' || (!force && tr.reviewUntil > Date.now())) continue;
    const votes = Object.keys(tr.votes||{}).length;
    if (votes >= S.settings.vetoVotes){ u['trades/'+id+'/status'] = 'vetoed'; logUpdate(u, `League vetoed the ${tName(tr.from)}–${tName(tr.to)} trade (${votes} votes)`); }
    else executeTrade(id,u);
  }
}
let lastProc = 0, procBusy = false;
/* runs waivers + trade reviews whose time is up. Called on page loads and by the Sim Lab clock (force) */
async function processPending(force){
  if (!S || S.draft.status!=='done' || procBusy) return; lastProc = Date.now();
  const dueW = Object.values(S.waivers).some(w=>force || w.until<=Date.now()), dueT = Object.values(S.trades).some(t=>t.status==='review' && (force || t.reviewUntil<=Date.now()));
  const needOrder = !S.waiverOrder;
  if (!dueW && !dueT && !needOrder) return;
  procBusy = true;
  try{
    if (!(await Store.lock('pending', 20000))) return;
    MEMO.clear(); const u = {};
    if (needOrder) u.waiverOrder = S.draft.order.slice().reverse();
    if (dueW) processWaivers(u, force);
    if (dueT) processTrades(u, force);
    if (Object.keys(u).length) Store.update(u);
  } finally { procBusy = false; }
}

    ${canEdit(t)?`<div class="card"><div class="row">
      <b>Auto-set lineup</b>
      <select id="amode" onchange="lsSet('b3h_automode',this.value);$('#adesc').textContent=AUTO_MODES[this.value].desc">${Object.entries(AUTO_MODES).map(([k,m])=>`<option value="${k}" ${k===(lsGet('b3h_automode')||'proj')?'selected':''}>${m.label}</option>`).join('')}</select>
      <button class="btn" ${locked&&!isCommish()?'disabled':''} onclick="startActive('${t}','${d}',$('#amode').value)">Start active players (${dayName(d)})</button>
      <button class="btn pri" onclick="autoSet('${t}',${w},$('#amode').value)">Auto-set rest of Week ${w}</button>
      <label class="small"><input type="checkbox" ${S.teams[t].autopilot?'checked':''} onchange="Store.update({['teams/${t}/autopilot']:this.checked?$('#amode').value:null})"> Autopilot (auto-set every day I don't set myself)</label>
    </div><p id="adesc" class="muted small" style="margin:6px 0 0">${AUTO_MODES[lsGet('b3h_automode')||'proj'].desc}${S.teams[t].autopilot?` <b>Autopilot is on (${AUTO_MODES[S.teams[t].autopilot].label}).</b>`:''}</p></div>`:''}
    <div class="card tw"><table><tr><th>Slot</th><th>Player — ${dayName(d)}</th><th>Today</th><th>Started games this week</th><th class="num">Week pts</th></tr>`;
  const todayCell = pid => { if(!plays(pid,d)) return '<span class="muted small">no game</span>'; const g=gameOn(pid,d); if(g) return `<span class="chip ${ (rowOf(pid)&&(rowOf(pid).games.find(x=>x.date===d)||{}).counted)?'c':'x'}">${fmt(fpts(g.line))}</span>`; const n=usedBefore(pid); return `<b>plays</b>${n>=cap?` <span class="small" style="color:var(--acc2)">(already ${n} games — only counts if it beats his worst)</span>`:''}`; };
  S.settings.slots.forEach((slot,i)=>{
    const pid = lu[i], p = pid?pInfo(pid):null, r = pid&&rowOf(pid);
    const cell = edit && !slotLocked(pid) ? (pid?`<a class="pl small" title="Player card" onclick="openPlayer('${pid}')">ⓘ</a> `:'')+`<select onchange="setSlot('${t}','${d}',${i},this.value)"><option value="">— empty —</option>${ros.filter(x=>eligible(slot,pInfo(x).pos) && (x===pid || !slotLocked(x))).map(x=>`<option value="${x}" ${x===pid?'selected':''}>${esc(pInfo(x).name)} (${esc(pInfo(x).pos)})${plays(x,d)?' ●':''}</option>`).join('')}</select>`
      : (p?`${slotLocked(pid)?'🔒 ':''}${pLink(pid)} <span class="muted small">${esc(p.pos)} · ${esc(p.team)}${p.inj?' · '+esc(p.inj):''}</span>`:'<span class="muted">Empty</span>');
    h += `<tr><td><span class="pos">${slot}</span></td><td>${cell}</td><td>${p?todayCell(pid):''}</td>
      <td>${r?r.games.map(g=>`<span class="chip ${g.counted?'c':'x'}" title="${dayName(g.date)}">${fmt(g.fp)}</span>`).join(''):''}</td><td class="num"><b>${r?fmt(r.pts):''}</b></td></tr>`;
  });
  const benchPts = T.rows.filter(r=>!lu.includes(r.pid));

    ${benchPts.length?`<p class="muted small">Also counting this week (started on other days): ${benchPts.map(r=>`${pLink(r.pid)} ${fmt(r.pts)}`).join(' · ')}</p>`:''}
    <h3>Bench — ${dayName(d)}</h3><div class="card tw"><table><tr><th>Player</th><th>Pos</th><th>Team</th><th>Today</th><th></th></tr>${bench.map(p=>{const i=pInfo(p);return `<tr><td>${pLink(p)}${i.inj?` <span class="muted small">${esc(i.inj)}</span>`:''}</td><td><span class="pos">${esc(i.pos)}</span></td><td>${esc(i.team)}</td><td>${plays(p,d)?'<b>plays</b> <span class="muted small">(won\'t count on bench)</span>':'<span class="muted small">no game</span>'}</td><td class="num">${canEdit(t)&&S.draft.status==='done'?`${S.settings.irSlots&&canIR(p)?`<button class="btn sm" onclick="moveToIR('${t}','${p}')">IR</button> `:''}<button class="btn sm danger" onclick="confirmDrop('${t}','${p}')">Drop</button>`:''}</td></tr>`;}).join('')||'<tr><td class="muted">Nobody on the bench</td></tr>'}</table></div>
    ${S.settings.irSlots?`<h3>Injured reserve (${irIds(t).length}/${S.settings.irSlots})</h3><div class="card tw"><table>${irIds(t).map(p=>{const i=pInfo(p);return `<tr><td>${pLink(p)} <span class="muted small">${esc(i.pos)} · ${esc(i.team)}${i.inj?' · '+esc(i.inj):''}</span></td><td class="num">${canEdit(t)?`<button class="btn sm" onclick="activateIR('${t}','${p}')">Activate</button> <button class="btn sm danger" onclick="confirmDrop('${t}','${p}')">Drop</button>`:''}</td></tr>`;}).join('')||'<tr><td class="muted small">Empty. Players listed as OUT can be moved here from the bench to free a roster spot (games on IR never count).</td></tr>'}</table></div>`:''}`;
  return h;
}
function setSlot(t,d,i,pid){
  const lu = lineupForDay(t,d).slice(), j = pid ? lu.indexOf(pid) : -1;
  if (!isCommish() && ((lu[i] && playerLocked(lu[i],d)) || (pid && playerLocked(pid,d)))) return toast("That player's game already started — he's locked for today.");
  if (j>=0 && j!==i){ if (lu[i] && !eligible(S.settings.slots[j], pInfo(lu[i]).pos)) lu[j]=null; else lu[j]=lu[i]; }
  lu[i] = pid||null;
  Store.update({['lineups/'+t+'/d'+d]: luObj(lu)});
}
function confirmDrop(t,pid){ openModal(`<h3>Drop ${esc(pInfo(pid).name)}?</h3><p class="muted">He goes straight to free agency.</p><div class="row"><button class="btn danger" onclick="closeModal();dropPlayer('${t}','${pid}')">Drop</button><button class="btn" onclick="closeModal()">Cancel</button></div>`); }

/* Players + draft list */
function vPlayers(){
  const s = S.settings, mine = Object.entries(S.claims).filter(([id,c])=>c.team===ME&&c.status==='pending'), order = S.waiverOrder||S.draft.order.slice().reverse();
  return `<h2>Players</h2>
  <p class="muted small">${s.acqSystem==='waivers'?`<b>Waivers:</b> dropped players sit on waivers for ${s.waiverDays} day${s.waiverDays===1?'':'s'} (marked <b style="color:var(--acc2)">W</b>) — put in a claim and the team with the best waiver priority gets him; that team then moves to the back of the line. Everyone else is a free agent you can add right away.`:'Free agency: first come, first served.'}
  ${s.addsPerWeek?` You've used <b>${addsUsed(ME)}/${s.addsPerWeek}</b> adds this matchup.`:''} Your waiver priority: <b>#${order.indexOf(ME)+1}</b> of ${order.length}.</p>
  ${mine.length?`<div class="card"><h3 style="margin-top:0">Your pending claims</h3>${mine.map(([id,c])=>`<div class="row" style="justify-content:space-between;margin:3px 0"><span>${esc(pInfo(c.pid).name)}${c.drop?` <span class="muted small">(drop ${esc(pInfo(c.drop).name)})</span>`:''} <span class="muted small">· ${esc(waiverText(c.pid))}</span></span><button class="btn sm" onclick="cancelClaim('${id}')">Cancel</button></div>`).join('')}</div>`:''}
  ${filterBar()}<div id="plist" class="card tw"></div>`;
}
function filterBar(){
  return `<div class="row" style="margin-bottom:10px"><input id="pq" placeholder="Search players" value="${esc(ui.q)}" oninput="ui.q=this.value;renderPlayerList()">
  <select onchange="ui.pos=this.value;renderPlayerList()">${['ALL','PG','SG','SF','PF','C','G','F'].map(p=>`<option ${p===ui.pos?'selected':''}>${p}</option>`).join('')}</select>
  ${ui.tab==='players'?`<label class="small"><input type="checkbox" ${ui.avail?'checked':''} onchange="ui.avail=this.checked;renderPlayerList()"> Free agents only</label>`:''}
  <span class="muted small">${Object.keys(POOL).length} players · ${esc(POOL_SRC)}</span></div>`;
}
function avgFp(pid){
  let n=0,s=0; const last = isSim()? curWeek() : liveWeek();
  for (let w=Math.max(1,last-2); w<=last; w++) for (const g of playerGames(pid,w)){ n++; s+=fpts(g.line); }
  return n? s/n : null;
}
function renderPlayerList(){
  const el = $('#plist'); if (!el) return;
  const q = norm(ui.q), draft = ui.tab==='draft';
  let list = Object.values(POOL).filter(p=>(!q||norm(p.name).includes(q)) && (ui.pos==='ALL'||eligible(ui.pos,p.pos)));
  if (draft || ui.avail) list = list.filter(p=>!ownerOf(p.id));
  list.sort((a,b)=>a.rank-b.rank); list = list.slice(0,100);
  const d = draftInfo(), myPick = d.team && (d.team===ME || isCommish()) && S.draft.status==='live';
  const done = S.draft.status==='done', full = activeCount(ME) >= S.settings.rosterSize, myClaims = new Set(Object.values(S.claims).filter(c=>c.team===ME&&c.status==='pending').map(c=>c.pid));
  el.innerHTML = `<table><tr><th>Rk</th><th>Player</th><th>Pos</th><th>NBA</th>${draft?'':'<th>Owner</th><th class="num">Avg FP</th>'}<th></th></tr>${list.map(p=>{
    const own = ownerOf(p.id), a = draft? null : avgFp(p.id);
    let btn = '';
    if (draft) btn = `<button class="btn sm pri" ${myPick?'':'disabled'} onclick="makePick('${p.id}')">Draft</button>`;
    else if (!own && done) btn = myClaims.has(p.id) ? '<span class="tag">Claimed</span>' : `<button class="btn sm pri" onclick="${full?`pickDrop('${p.id}')`:`addPlayer(ME,'${p.id}')`}">${onWaivers(p.id)?'Claim':'Add'}</button>`;
    return `<tr><td class="muted">${p.rank>RANKS.length?'—':p.rank}</td><td>${pLink(p.id)}${p.inj?` <span class="muted small">${esc(p.inj)}</span>`:''}</td><td><span class="pos">${esc(p.pos)}</span></td><td>${esc(p.team)}</td>
    ${draft?'':`<td>${own?esc(tName(own)):onWaivers(p.id)?`<span class="small" style="color:var(--acc2)" title="${esc(waiverText(p.id))}">W</span>`:'<span class="muted">FA</span>'}</td><td class="num">${a===null?'—':fmt(a)}</td>`}<td class="num">${btn}</td></tr>`;}).join('')}</table>`;
}
function pickDrop(pid){
  openModal(`<h3>Add ${esc(POOL[pid].name)}</h3><p class="muted">Your roster is full — pick someone to drop.</p>${rosterIds(ME).map(x=>`<div class="row" style="justify-content:space-between;margin:4px 0"><span>${esc(pInfo(x).name)} <span class="muted small">${esc(pInfo(x).pos)}</span></span><button class="btn sm danger" onclick="closeModal();addPlayer(ME,'${pid}','${x}')">Drop</button></div>`).join('')}<div class="row" style="margin-top:10px"><button class="btn" onclick="closeModal()">Cancel</button></div>`);
}

/* Draft */
function vDraft(){
  const d = draftInfo(), st = S.draft.status, cm = isCommish();
  let h = `<h2>Draft</h2>`;
  if (st==='pre'){
    const kept = Object.values(S.draft.picks).filter(p=>p.keeper).length;
    h += `<div class="card"><p>${S.settings.season} · ${dSnake()?'Snake':'Straight (same order every round)'} draft · ${dRounds()} rounds · ${d.N} teams${S.settings.leagueType==='dynasty'?' · rookie/free-agent draft':''}${kept?` · ${kept} keepers already placed on the board`:''}.</p>
      <h3>Draft order</h3><table>${S.draft.order.map((t,i)=>`<tr><td>${i+1}.</td><td><b>${esc(tName(t))}</b></td><td class="num">${cm&&!kept?`<button class="btn sm" ${i?'':'disabled'} onclick="moveOrder(${i},-1)">▲</button> <button class="btn sm" ${i<S.draft.order.length-1?'':'disabled'} onclick="moveOrder(${i},1)">▼</button>`:''}</td></tr>`).join('')}</table>
      <p class="small muted">${S.settings.pickSeconds?`${S.settings.pickSeconds} seconds per pick — when the clock runs out, the best available player is auto-picked.`:'No pick clock.'} Change in Settings.</p>
      ${kept?`<p class="small muted">Keepers are on the board below. Randomizing the order would move them, so it's disabled.</p>`:''}
      <div class="row">${cm?`<button class="btn" ${kept?'disabled':''} onclick="randomizeOrder()">Randomize order</button><button class="btn pri" onclick="startDraft()">Start draft</button>`:'<span class="muted">Waiting for the commissioner to start the draft. (Turn on Commissioner mode in the League tab.)</span>'}</div></div>`;
    if (!kept) return h;
  }
  if (st==='live') h += `<div class="banner row" style="justify-content:space-between"><span>On the clock: ${esc(tName(d.team))} — Round ${d.rnd}, pick ${d.pickInRnd}${d.team===ME?' · THAT\'S YOU':''}</span><span id="pickClock" style="font-size:20px"></span>${cm&&S.settings.pickSeconds?`<button class="btn sm" onclick="Store.update({'draft/paused':${S.draft.paused?'null':'true'},'draft/clock':Date.now()})">${S.draft.paused?'Resume clock':'Pause clock'}</button>`:''}</div>
    <div class="row" style="margin-bottom:10px">${(d.team===ME||cm)?`<button class="btn" onclick="makePick(bestAvailable().id)">Auto-pick best available</button>`:''}${cm?`<button class="btn" onclick="simRestOfDraft()">Commish: auto-draft the rest</button><button class="btn danger" onclick="undoPick()">Undo last pick</button>`:''}</div>`;
  else if (st==='done') h += `<div class="banner">Draft complete. Set your lineup in My Team.</div>${cm?`<div class="row" style="margin-bottom:10px"><button class="btn danger" onclick="undoPick()">Undo last pick</button></div>`:''}`;
  // board
  const N = d.N; let b = `<div class="tw"><div class="board" style="grid-template-columns:repeat(${N},minmax(92px,1fr))">` + S.draft.order.map(t=>`<div class="hd">${esc(tName(t))}</div>`).join('');
  for (let r=0;r<dRounds();r++) for (let c=0;c<N;c++){
    const n = pickAt(r,c), pk = S.draft.picks[n], team = S.draft.order[c];
    b += `<div class="${team===ME?'me':''}">${pk?`${pLink(pk.pid,true)}<br><span class="muted">${esc(pInfo(pk.pid).pos)} · ${r+1}.${(n%N)+1}${pk.keeper?' · <span style="color:var(--acc2)">KEEPER</span>':''}</span>`:`<span class="muted">${r+1}.${(n%N)+1}</span>`}</div>`;
  }
  b += `</div></div>`;
  if (st==='live') h += `<div class="grid2"><div>${filterBar()}<div id="plist" class="card tw"></div></div><div class="card">${b}</div></div>`;
  else h += `<div class="card">${b}</div>`;
  return h;
}
function randomizeOrder(){ const o=S.draft.order.slice().sort(()=>Math.random()-.5); Store.update({'draft/order':o}); }

/* Trades */
function vTrades(){
  if (S.draft.status!=='done') return `<h2>Trades</h2><div class="banner">Trades open after the draft.</div>`;
  const other = ui.tradeWith && ui.tradeWith!==ME ? ui.tradeWith : teamIds().find(t=>t!==ME);
  const list = (t,set,name) => allRosterIds(t).map(p=>`<label class="row small" style="margin:3px 0"><input type="checkbox" ${set.has(p)?'checked':''} onchange="ui.${name}[this.checked?'add':'delete']('${p}')"> ${esc(pInfo(p).name)} <span class="muted">${esc(pInfo(p).pos)}</span></label>`).join('');
  const s = S.settings, pastDeadline = s.tradeDeadline && todayStr() > s.tradeDeadline;
  let h = `<h2>Trades</h2><p class="muted small">${s.tradeReviewDays?`Accepted trades go through a ${s.tradeReviewDays}-day league review. If ${s.vetoVotes} other teams vote to veto, it's cancelled.`:'Accepted trades go through right away.'} ${s.tradeDeadline?`Trade deadline: ${s.tradeDeadline.slice(4,6)}/${s.tradeDeadline.slice(6)}.`:'No trade deadline.'}</p>
  ${pastDeadline?'<div class="banner">The trade deadline has passed.</div>':''}<div class="card"><h3>Propose a trade</h3><div class="row" style="margin-bottom:8px">Trade with <select onchange="ui.tradeWith=this.value;ui.tradeGet.clear();render()">${teamIds().filter(t=>t!==ME).map(t=>`<option value="${t}" ${t===other?'selected':''}>${esc(tName(t))}</option>`).join('')}</select></div>
    <div class="grid2"><div><b>You send</b>${list(ME,ui.tradeGive,'tradeGive')}</div><div><b>You get</b>${list(other,ui.tradeGet,'tradeGet')}</div></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" onclick="proposeTrade('${other}')">Send offer</button></div></div><h3>Offers</h3>`;
  const trs = Object.entries(S.trades).sort((a,b)=>b[1].ts-a[1].ts);
  if (!trs.length) h += `<p class="muted">No trades yet.</p>`;
  for (const [id,tr] of trs){
    const names = o => Object.keys(o||{}).map(p=>pLink(p)).join(', ')||'nothing';
    let act = '';
    if (tr.status==='pending'){
      if (tr.to===ME || isCommish()) act += `<button class="btn sm pri" onclick="acceptTrade('${id}')">Accept${tr.to!==ME?' (as '+esc(tName(tr.to))+')':''}</button> <button class="btn sm" onclick="Store.update({'trades/${id}/status':'rejected'})">Reject</button> `;
      if (tr.from===ME) act += `<button class="btn sm" onclick="Store.update({'trades/${id}/status':'cancelled'})">Cancel</button> `;
    }
    if (tr.status==='review'){
      const votes = Object.keys(tr.votes||{}), left = Math.max(0, tr.reviewUntil-Date.now());
      act += `<span class="small muted">Goes through in ${Math.floor(left/3600e3)}h ${Math.floor(left%3600e3/60e3)}m · veto votes ${votes.length}/${S.settings.vetoVotes}</span> `;
      if (ME!==tr.from && ME!==tr.to && !votes.includes(ME)) act += `<button class="btn sm danger" onclick="voteVeto('${id}')">Vote to veto</button> `;
      if (isCommish()) act += `<button class="btn sm pri" onclick="checkpoint('Before trade');const u={};executeTrade('${id}',u);Store.update(u)">Commish: approve now</button> <button class="btn sm danger" onclick="Store.update(logUpdate({'trades/${id}/status':'vetoed'},'Commissioner vetoed a trade'))">Commish: veto</button>`;
    }
    if (tr.status==='accepted' && isCommish()) act += `<button class="btn sm danger" onclick="vetoTrade('${id}')">Commish: reverse trade</button>`;
    h += `<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(tName(tr.from))}</b> sends ${names(tr.give)} → <b>${esc(tName(tr.to))}</b> sends ${names(tr.get)}</div><span class="tag">${tr.status.toUpperCase()}</span></div><div class="row" style="margin-top:6px">${act}</div></div>`;
  }
  return h;
}
function proposeTrade(to){
  if (S.settings.tradeDeadline && todayStr() > S.settings.tradeDeadline && !isCommish()) return toast('The trade deadline has passed.');
  if (!ui.tradeGive.size && !ui.tradeGet.size) return toast('Pick at least one player.');
  const id = uid(), o = s => Object.fromEntries([...s].map(p=>[p,true]));
  Store.update(logUpdate({['trades/'+id]:{from:ME,to,give:o(ui.tradeGive),get:o(ui.tradeGet),status:'pending',ts:Date.now()}}, `${tName(ME)} sent a trade offer to ${tName(to)}`));
  ui.tradeGive.clear(); ui.tradeGet.clear();
}
function vetoTrade(id){
  const tr = S.trades[id], u = freezeLineups(tr.to, freezeLineups(tr.from, {['trades/'+id+'/status']:'vetoed'}));
  Object.keys(tr.give||{}).forEach(p=>{ if(ownerOf(p)===tr.to){ u['rosters/'+tr.to+'/'+p]=null; u['rosters/'+tr.from+'/'+p]=S.rosters[tr.to][p]; } });
  Object.keys(tr.get||{}).forEach(p=>{ if(ownerOf(p)===tr.from){ u['rosters/'+tr.from+'/'+p]=null; u['rosters/'+tr.to+'/'+p]=S.rosters[tr.from][p]; } });
  Store.update(logUpdate(u,'Commissioner vetoed a trade — players returned'));
}

/* Standings */
function vStandings(){
  if (S.draft.status!=='done') return `<h2>Standings</h2><div class="banner">Standings start after the draft.</div>`;
  const st = standings(), n = S.settings.playoffTeams, b = bracket();
  let h = `<h2>Standings</h2><div class="card tw"><table><tr><th>#</th><th>Team</th><th>W-L-T</th><th class="num">PF</th><th class="num">PA</th></tr>${st.map((r,i)=>`<tr${r.t===ME?' style="background:rgba(255,122,26,.08)"':''}><td>${i+1}</td><td><b>${esc(tName(r.t))}</b></td><td>${r.w}-${r.l}-${r.tie}</td><td class="num">${fmt(r.pf)}</td><td class="num">${fmt(r.pa)}</td></tr>${i===n-1&&n<st.length?'<tr><td colspan="5" class="small" style="color:var(--acc2);border-bottom:2px dashed var(--acc2)">▲ playoff line</td></tr>':''}`).join('')}</table></div>
  <p class="muted small">${S.settings.regWeeks}-week regular season, then a ${n}-team playoff (${S.settings.playoffRoundWeeks}-week rounds, ${S.settings.champRoundWeeks}-week final). Ties in the standings go to total points for; tied playoff matchups go to the higher seed.</p><h3>Playoff bracket</h3>`;
  if (!b) return h + `<div class="card muted">Bracket is set when the regular season ends (${weekLabel(S.settings.regWeeks).split(' · ')[1]}).</div>`;
  const seed = t => b.seeds.indexOf(t)+1;
  h += b.champ ? `<div class="banner">🏆 ${esc(tName(b.champ))} — league champion!</div>` : '';
  h += `<div class="grid2">` + b.rounds.map(rd=>`<div class="card"><h3 style="margin-top:0">${rd.final?'Championship':'Round '+rd.r} <span class="muted small">· weeks ${rd.weeks.join(' & ')}</span></h3>
    ${rd.byes.map(t=>`<div class="small muted">(${seed(t)}) ${esc(tName(t))} — bye</div>`).join('')}
    ${rd.games.map(g=>`<div class="mu" style="cursor:default;margin:6px 0"><div class="${g.win===g.a?'win':''}">(${seed(g.a)}) <b>${esc(tName(g.a))}</b></div><div><b>${fmt(g.A)}</b> – <b>${fmt(g.B)}</b></div><div class="r ${g.win===g.b?'win':''}"><b>${esc(tName(g.b))}</b> (${seed(g.b)})</div></div>`).join('')}
    ${rd.cons.length?`<div class="small muted" style="margin-top:8px">Consolation: ${rd.cons.map(g=>`${esc(tName(g.a))} ${fmt(g.A)}–${fmt(g.B)} ${esc(tName(g.b))}`).join(' · ')}</div>`:''}</div>`).join('') + `</div>`;
  return h;
}

/* Settings — mirrors ESPN's settings page; only the commissioner can change things */

function slotCounts(){ const c = {}; SLOT_TYPES.forEach(x=>c[x]=0); S.settings.slots.forEach(x=>c[x]=(c[x]||0)+1); return c; }
function setSlotCount(type,n){ const c = slotCounts(); c[type] = n; const slots = []; SLOT_TYPES.forEach(x=>{ for(let i=0;i<c[x];i++) slots.push(x); }); Store.update({'settings/slots':slots}); }
function setNumTeams(n){
  if (S.draft.status!=='pre' || Object.keys(S.draft.picks).length) return toast('Team count can only change before the draft.');
  const u = {}, ids = []; for (let i=0;i<n;i++){ ids.push('t'+i); if (!S.teams['t'+i]) u['teams/t'+i] = {name: DEFAULT_TEAM_NAMES[i]||'Team '+(i+1)}; }

  u['draft/order'] = S.draft.order.filter(t=>ids.includes(t)).concat(ids.filter(t=>!S.draft.order.includes(t)));

}

/* =================== MOCK DRAFT (practice only — never touches the real league) =================== */
let MOCK = null; try{ MOCK = JSON.parse(lsGet('b3h_mock')||'null'); }catch(e){}
let mockTimer = null;
const mockSave = () => lsSet('b3h_mock', JSON.stringify(MOCK));
const mockTeamAt = n => { const N=MOCK.N, r=Math.floor(n/N), k=n%N; return r%2===0 ? k : N-1-k; };
const mockTotal = () => MOCK.N*MOCK.rounds;
const mockMine = () => MOCK.slot-1;
const mockTeamName = i => i===mockMine() ? 'You' : 'CPU '+(i+1);
function mockAvail(){ const taken=new Set(MOCK.picks); return Object.values(POOL).filter(p=>!taken.has(p.id)).sort((a,b)=>a.rank-b.rank); }
function mockRoster(i){ return MOCK.picks.filter((p,n)=>mockTeamAt(n)===i); }
function cpuChoose(i){
  const av = mockAvail().slice(0,8), mine = mockRoster(i).map(p=>pInfo(p).pos);
  const has = pos => mine.filter(x=>x===pos||(ELIG[x]&&ELIG[x].includes(pos))).length;
  // weighted pick near the top of the board, nudged toward positions the CPU still needs
  const w = av.map((p,k)=>{ let x = [40,22,14,9,6,4,3,2][k]; if (MOCK.picks.length/MOCK.N > 5){ if(/C/.test(p.pos)&&!has('C')) x*=2.2; if(/G/.test(p.pos)&&has('PG')+has('SG')+has('G')<2) x*=1.6; } return x; });
  let r = Math.random()*w.reduce((a,b)=>a+b,0); for (let k=0;k<av.length;k++){ r-=w[k]; if(r<=0) return av[k].id; } return av[0].id;
}
function mockTick(){
  clearTimeout(mockTimer);
  if (!MOCK || MOCK.picks.length>=mockTotal()) return;
  const n = MOCK.picks.length, team = mockTeamAt(n);
  if (team===mockMine() && !MOCK.autoMe) return;
  mockTimer = setTimeout(()=>{ MOCK.picks.push(cpuChoose(team)); mockSave(); if(ui.tab==='mock') render(); mockTick(); }, MOCK.fast||MOCK.autoMe ? 25 : 450);
}
function mockStart(){
  const N = +$('#mN').value, sl = $('#mS').value, rounds = +$('#mR').value;
  MOCK = {N, rounds, slot: sl==='rand' ? 1+Math.floor(Math.random()*N) : Math.min(+sl,N), picks:[], fast: $('#mF').checked, autoMe:false, started:Date.now()};
  mockSave(); render(); mockTick();
}
function mockPick(pid){ if(!MOCK || mockTeamAt(MOCK.picks.length)!==mockMine() || MOCK.picks.includes(pid)) return; MOCK.picks.push(pid); mockSave(); render(); mockTick(); }
function mockSimToEnd(){ MOCK.autoMe = true; MOCK.fast = true; mockSave(); mockTick(); }
function mockQuit(){ clearTimeout(mockTimer); MOCK = null; lsSet('b3h_mock','null'); render(); }
function mockProj(i){ // projected weekly points: top 10 by projected avg × 3 games
  return mockRoster(i).map(p=>projAvg(pInfo(p))).sort((a,b)=>b-a).slice(0,10).reduce((a,b)=>a+b*3,0);
}

  for (let r=0;r<MOCK.rounds;r++) for (let c=0;c<N;c++){ const k = r%2===0? r*N+c : r*N+(N-1-c), pid = MOCK.picks[k];

  b += `</div></div>`;
  h += done ? `<div class="card">${b}</div>` : `<div class="grid2"><div><div class="row" style="margin-bottom:10px"><input id="mq" placeholder="Search players" value="${esc(ui.mq||'')}" oninput="ui.mq=this.value;renderMockList()">

  return h;
}

  if (STORE_MODE==='firebase' && !isCommish()) return toast('Only the commissioner can replace the online league.');
  if (S && lsGet('b3h_pending_mock')!=='1' && !confirm('Replace the sandbox league with this mock?')) return;
  lsSet('b3h_pending_mock','0');
  const teams = {}, rosters = {}, picks = {}, order = [];
  for (let i=0;i<MOCK.N;i++){ teams['t'+i] = {name: mockTeamName(i)}; rosters['t'+i] = {}; order.push('t'+i); }
  MOCK.picks.forEach((pid,n)=>{ const t='t'+mockTeamAt(n); rosters[t][pid] = {...snap(pInfo(pid)), rnd: Math.floor(n/MOCK.N)+1}; picks[n] = {team:t, pid, ts:Date.now()}; });

/* =================== PLAYER CARD (ESPN-style pop-up) =================== */
const PCACHE = {};   // ESPN game logs by athlete id + season
function seasonYear(){ return (parseInt(S.settings.season)||2026)+1; }          // ESPN labels 2026-27 as 2027
async function fetchGameLog(id, season){
  const key = id+'|'+season; if (PCACHE[key]) return PCACHE[key];
  const j = await (await fetch(`https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes/${id}/gamelog?season=${season}`)).json();
  const labels = j.labels||[], evs = j.events||{}, out = [];
  for (const st of (j.seasonTypes||[])){
    if (/pre/i.test(st.displayName||'')) continue;
    for (const cat of (st.categories||[])) for (const e of (cat.events||[])){
      const ev = evs[e.eventId]||{}, get = l => { const i = labels.indexOf(l); return i<0 ? '0' : (e.stats||[])[i]; };
      const ma = l => String(get(l)).split('-').map(x=>parseInt(x)||0);
      const [FGM,FGA] = ma('FG'), [TPM,TPA] = ma('3PT'), [FTM,FTA] = ma('FT');
      const line = {PTS:+get('PTS')||0, FGM, FGA, '3PM':TPM, '3PA':TPA, FTM, FTA, REB:+get('REB')||0, AST:+get('AST')||0, STL:+get('STL')||0, BLK:+get('BLK')||0, TO:+get('TO')||0, PF:+get('PF')||0, MIN:parseInt(get('MIN'))||0};
      if (ev.gameDate) out.push({date: ymd(new Date(ev.gameDate)), opp: `${ev.atVs||''} ${(ev.opponent&&ev.opponent.abbreviation)||''}`.trim(), result: ev.gameResult||'', line});
    }
  }
  out.sort((a,b)=>b.date.localeCompare(a.date));
  PCACHE[key] = out; return out;
}
function simLog(pid){
  const out = [], last = curWeek();
  for (let w=1; w<=last; w++) for (const g of playerGames(pid,w)) out.push({date:g.date, opp:'vs '+g.opp, result:'', line:g.line});
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
function avgRow(log){
  if (!log || !log.length) return null;
  const n = log.length, sum = k => log.reduce((a,g)=>a+statVal(g.line,k),0), fp = log.reduce((a,g)=>a+fpts(g.line),0);
  return {GP:n, MIN:sum('MIN')/n, PTS:sum('PTS')/n, REB:sum('REB')/n, AST:sum('AST')/n, STL:sum('STL')/n, BLK:sum('BLK')/n, TO:sum('TO')/n, '3PM':sum('3PM')/n, FPG:fp/n, FPTS:fp};
}
/* what happened to each game in the fantasy league: started & counted, started but outside best 3, or on the bench */
function fantasyTag(pid, d){
  const t = ownerOf(pid); if (!t || !S.draft || S.draft.status!=='done') return '';
  const w = weekOfDate(d); if (w<1 || weekDates(w).indexOf(d)<0) return '';
  const r = teamWeek(t,w).rows.find(x=>x.pid===pid), g = r && r.games.find(x=>x.date===d);
  if (g) return g.counted ? '<span class="chip c">counted</span>' : '<span class="chip x">not in best 3</span>';
  return '<span class="small muted">bench</span>';
}
function upcoming(pid){
  const out = [], start = isSim() ? (()=>{ const w=curWeek(), ds=weekDates(w); return ds[Math.min(simDaysPlayed(w), ds.length-1)]; })() : todayStr();
  let d = new Date(+start.slice(0,4), +start.slice(4,6)-1, +start.slice(6));
  for (let i=0;i<7;i++){ const k = ymd(d); if (plays(pid,k)){ const opp = isSim() ? 'vs '+oppOn(pid,k) : ((GI[k]&&GI[k][pInfo(pid).team]||{}).opp||''); out.push(`${dayName(k)} ${+k.slice(4,6)}/${+k.slice(6)} ${esc(opp)}`); } d.setDate(d.getDate()+1); }
  return out;
}

/* =================== FANTASYCAST: live stats + fantasy points for a matchup =================== */
function castDayDefault(w){
  const ds = weekDates(w);
  if (isSim()){ const n = simDaysPlayed(w); return ds[Math.max(0, n-1)]; }
  const t = todayStr(); return ds.includes(t) ? t : (t < ds[0] ? ds[0] : ds[ds.length-1]);
}
function gameStatus(pid,d){
  const p = pInfo(pid);
  if (!plays(pid,d)) return {txt:'No game', state:'none'};
  if (isSim()){ const opp = oppOn(pid,d); return dayLocked(d) ? {txt:`Final · vs ${opp}`, state:'post'} : {txt:`vs ${opp} · not played yet`, state:'pre'}; }
  const g = GI[d] && GI[d][p.team]; if (!g) return {txt:'Scheduled', state:'pre'};
  return {txt: `${g.opp} · ${g.status}${g.score?` · ${g.score}`:''}`, state:g.state};
}

const CALC_K = ['PTS','FGM','REB','AST','STL','BLK','TO'];
function calcLine(){ const r=Math.random, f=.6+r()*.9, P=Math.round(24*f*(.7+r()*.6)); return {PTS:P, FGM:Math.round(P*.38), REB:Math.round(8*f*(.6+r()*.8)), AST:Math.round(6*f*(.6+r()*.8)), STL:Math.round(r()*2.5), BLK:Math.round(r()*2), TO:Math.round(r()*4)}; }
ui.calc = Array.from({length:4}, calcLine);
function calcResize(n){ while(ui.calc.length<n) ui.calc.push(calcLine()); ui.calc.length=n; render(); }
function calcRandom(){ ui.calc = ui.calc.map(calcLine); render(); }
function renderCalc(){
  if (!$('#cout')) return;
  const fp = ui.calc.map(fpts), cap = S.settings.gameCap, best = fp.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,cap).map(x=>x[1]);
  fp.forEach((v,i)=>{ $('#cfp'+i).innerHTML = `<b>${fmt(v)}</b>`; $('#cst'+i).innerHTML = best.includes(i)?'<span class="chip c">counts</span>':'<span class="chip x">dropped</span>'; });
  const counted = best.reduce((a,i)=>a+fp[i],0), all = fp.reduce((a,b)=>a+b,0);
  $('#cout').innerHTML = `Counted: <b>${best.sort((a,b)=>a-b).map(i=>fmt(fp[i])).join(' + ')} = ${fmt(counted)}</b>` + (fp.length>cap?` · Without the cap he'd score ${fmt(all)} — <span style="color:var(--bad)">${fmt(all-counted)} dropped</span>.`:` · Under ${cap+1} games, so nothing is dropped.`);
}
function quickTest(){ if (S.draft.status==='pre') S.draft.order = S.draft.order; simRestOfDraft(); Store.update({'draft/status':'done','settings/statsMode':'sim','settings/simWeek':2,'settings/simDay':3}); go('matchup'); }

$('#meSel').addEventListener('change', e=>{ ME=e.target.value; lsSet('b3h_me',ME); ui.tradeGive.clear(); ui.tradeGet.clear(); ui.teamView=null; render(); });

(async()=>{ await loadPool(); await Store.init(); if (DEMO && MOCK && lsGet('b3h_pending_mock')==='1' && MOCK.picks.length>=mockTotal()) mockToLeague(); if (MOCK) mockTick(); })();
</script>
